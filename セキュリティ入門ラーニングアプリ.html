<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("theme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<script>
  (() => {
    try {
      if (new URLSearchParams(window.location.search).get("theme")) return;
      const saved = localStorage.getItem("learn-ui:theme");
      if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* storage unavailable */ }
  })();
</script>

<header class="top">

    <div class="bar"><i id="progbar"></i></div>

  </div>

  <button class="iconbtn" id="themeBtn" type="button" aria-label="ライト／ダーク切り替え" title="ライト／ダーク切り替え">◐<span class="lab"> 表示切替</span></button>

<script>
  (() => {
    const root = document.documentElement, hdr = document.querySelector("header.top");
    const syncHdr = () => { if (hdr) root.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); };
    const mark = () => {
      const cur = root.getAttribute("data-fs") || "m";
      document.querySelectorAll(".fsz button").forEach((b) => { const on = b.dataset.fs === cur; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
      syncHdr();
    };
    document.querySelectorAll(".fsz button").forEach((b) => b.addEventListener("click", () => {
      const v = b.dataset.fs;
      if (v === "m") root.removeAttribute("data-fs"); else root.setAttribute("data-fs", v);
      try { localStorage.setItem("learn-ui:fs", v); } catch (e) { /* storage unavailable */ }
      mark();
    }));
    window.addEventListener("resize", syncHdr);
    mark();
  })();
</script>
<script>
  (() => {
    const root = document.documentElement;
    // remember the light/dark choice (the button itself is wired in each app)
    try {
      new MutationObserver(() => {
        try { localStorage.setItem("learn-ui:theme", root.getAttribute("data-theme") || "light"); } catch (e) { /* storage unavailable */ }
      }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) { /* MutationObserver unavailable */ }
    // favicon drawn from the header logo in the theme accent color
    const logo = document.querySelector(".logo");
    if (logo) {
      const cs = getComputedStyle(root);
      const acc = cs.getPropertyValue("--cp-accent").trim(), fg = cs.getPropertyValue("--cp-accent-fg").trim();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${acc}"/><text x="32" y="44" font-size="34" font-weight="700" text-anchor="middle" fill="${fg}" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">${logo.textContent.trim()}</text></svg>`;
      let icon = document.querySelector('link[rel="icon"]');
      if (!icon) { icon = document.createElement("link"); icon.rel = "icon"; document.head.appendChild(icon); }
      icon.href = "data:image/svg+xml," + encodeURIComponent(svg);
    }
    // phones / tablets: the lesson list opens as a drawer from the header
    const navBtn = document.getElementById("navBtn");
    const setNav = (open) => {
      document.body.classList.toggle("nav-open", open);
      if (navBtn) navBtn.setAttribute("aria-expanded", open ? "true" : "false");
    };
    if (navBtn) navBtn.addEventListener("click", (e) => { e.stopPropagation(); setNav(!document.body.classList.contains("nav-open")); });
    document.addEventListener("click", (e) => {
      if (!document.body.classList.contains("nav-open")) return;
      if (e.target.closest("#nav [data-go]") || !e.target.closest("#nav")) setNav(false);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setNav(false); });
    // back-to-top button for long lessons
    const up = document.createElement("button");
    up.type = "button"; up.className = "totop"; up.textContent = "▲"; up.title = "ページの先頭へ"; up.setAttribute("aria-label", "ページの先頭へ");
    up.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    document.body.appendChild(up);
    window.addEventListener("scroll", () => up.classList.toggle("show", window.scrollY > 900), { passive: true });
    // deep links: #lesson-id in the address bar (bookmarks, sharing, browser back/forward)
    const baseTitle = document.title;
    window.LearnShell = {
      hashId() { try { return decodeURIComponent(window.location.hash.slice(1)); } catch (e) { return ""; } },
      sync(id, title) {
        document.title = title && id !== "welcome" ? `${title}｜${baseTitle}` : baseTitle;
        try {
          const h = "#" + encodeURIComponent(id);
          if (!window.location.hash) history.replaceState(null, "", h);
          else if (window.location.hash !== h) history.pushState(null, "", h);
        } catch (e) { /* history API unavailable (sandboxed preview) */ }
      },
      start(lessons, fallback) { const h = this.hashId(); return lessons.some((l) => l.id === h) ? h : fallback; },
      xlRef(root, name) {
        const h1 = root.querySelector("h1");
        if (!h1 || !name) return;
        const p = document.createElement("p");
        p.className = "xlref";
        p.innerHTML = `<span aria-hidden="true">📗</span> Excel版の対応シート：「<b>${name}</b>」`;
        h1.insertAdjacentElement("afterend", p);
      },
    };
    const onHash = () => {
      const h = window.LearnShell.hashId();
      if (!h || typeof go !== "function" || typeof LESSONS === "undefined") return;
      if (LESSONS.some((l) => l.id === h) && h !== current) go(h);
    };
    window.addEventListener("popstate", onHash);
    window.addEventListener("hashchange", onHash);
    // shared quiz runner: one question at a time, score, review of missed questions, retry only the missed ones
    window.LearnQuiz = (box, all, cfg = {}) => {
      const AB = "ABCD";
      let qs = all, i = 0, score = 0, answered = false, wrong = [], retry = false;
      const title = (id) => (typeof LESSONS !== "undefined" && (LESSONS.find((l) => l.id === id) || {}).title) || "";
      const review = (q) => (q.lesson && title(q.lesson) ? `<a href="#" data-go="${q.lesson}">→「${title(q.lesson)}」を復習</a>` : "");
      const run = (list, isRetry) => { qs = list; i = 0; score = 0; wrong = []; retry = isRetry; show(); };
      const result = () => {
        const n = qs.length;

        const rev = wrong.map(({ q, j }) => `<div class="qrev"><div class="qq">${q.no ? `Q${q.no}　` : ""}${q.q}</div>
          <div class="qa ng">あなたの答え：${AB[j]}．${q.opts[j]}</div><div class="qa ok">正解：${AB[q.ans]}．${q.opts[q.ans]}</div>
          <div class="qe">${q.exp}${review(q) ? "　" + review(q) : ""}</div></div>`).join("");
        box.innerHTML = `<div style="text-align:center"><div class="kicker">${retry ? "RETRY RESULT" : "RESULT"}</div><div class="bigscore">${score} / ${n}</div>
          <p><b>${msg}</b></p>${best !== null ? `<p class="small muted">これまでの最高点：${best} 点</p>` : ""}
          <div class="btnrow" style="justify-content:center">${wrong.length ? `<button class="btn" type="button" data-qz="wrong">間違えた${wrong.length}問だけ解き直す</button>` : ""}
          <button class="btn${wrong.length ? " ghost" : ""}" type="button" data-qz="all">もう一度チャレンジ（${all.length}問）</button></div></div>

      run(all, false);

, {"id": "notes", "tag": "実務", "grp": "仕上げ", "title": "CISOの実務ノート", "desc": "運用カレンダー・最初の90日・よくあるミス", "xl": "CISO実務メモ", "time": "15分", "star": "－", "learn": "セキュリティ運用カレンダー・小さな会社の最初の90日・よくあるミス"}, {"id": "gloss", "tag": "辞書", "grp": "仕上げ", "title": "用語集", "desc": "日本語・英語で検索", "xl": "2 用語集", "time": "必要なとき", "star": "－", "learn": "よく出てくる言葉（日本語・英語つき）"}], "QUIZ": [{"q": "ニュースでいう「ハッキング（サイバー攻撃）」の説明として、最も近いものは？", "opts": ["PCに詳しい人が、便利なソフトを自分で作ること", "他人のPCやアカウントに、勝手に入ったり止めたりすること", "パスワードを忘れて、自分のアカウントに入れないこと", "ウイルス対策ソフトが、PCの中のウイルスを見つけて消すこと"], "ans": 1, "exp": "「ハッカー」はもともと技術に詳しい人のことで、「便利なソフトを作る」はその本来の意味に近いものです。ニュースの“ハッキング”は、その技術を悪用するサイバー攻撃を指します。", "lesson": "what"}, {"q": "「顧客名簿が盗まれて、外部に出回った」。主に損なわれたのはどれ？", "opts": ["機密性（見てよい人だけが見られること）", "完全性（内容が正しく、書き換えられていないこと）", "可用性（必要なときに使えること）", "どれも損なわれていない（名簿は手元に残っている）"], "ans": 0, "exp": "見てはいけない人に情報が渡ったので「機密性」。名簿が手元に残っていても、漏れた時点で被害です。書き換えられたら完全性、使えなくなったら可用性です。", "lesson": "what"}, {"q": "攻撃は「下見 → 侵入 → 居座る・広げる → 目的を果たす」と進みます。守る側の考え方として正しいものは？", "opts": ["侵入は100%は防げないので、入口の対策にお金をかけても意味がない", "入口さえ固めれば、中に入られたあとの対策はいらない", "どこか1か所で止めれば、被害を防いだり小さくしたりできる", "下見は防げないので、侵入されてから対策を考えればよい"], "ans": 2, "exp": "守る側は4つの段階のどこか1か所で止めればよい。だから、入口・中・もしものときと、種類のちがう守りを重ねます（多層防御）。", "lesson": "s1"}, {"q": "「多層防御」の説明として正しいものは？", "opts": ["高性能なファイアウォールを1台入れて、入口を集中して固める", "同じ種類のウイルス対策ソフトを2つ入れて、二重に見張る", "パスワードを長くして、ログインの守りを何重にも強くする", "種類のちがう守りを重ね、1つが破られても次で止める"], "ans": 3, "exp": "穴のあいたチーズを何枚も重ねるイメージ（スイスチーズモデル）。同じ種類の守りを重ねても、同じ穴があるので効果は小さくなります。", "lesson": "s1"}, {"q": "アドレス欄に鍵マーク（https）があるWebサイトについて、正しいものは？", "opts": ["本物の会社のサイトであることが、確認されている", "国や銀行が、安全なサイトとして認めている", "通信が暗号化されているだけで、本物とは限らない", "ウイルスが入っていないことが、確かめられている"], "ans": 2, "exp": "偽サイトの多くも https を使っています。鍵マークは「通信が暗号化されている」印で、「本物」の証明ではありません。", "lesson": "s2"}, {"q": "本物の銀行のドメインが「hikari-bank.example」のとき、本物の銀行のサイトと考えられるURLは？（教材用の架空のURLです）", "opts": ["https://hikari-bank.example.login-check.example/", "https://login.hikari-bank.example/", "https://hikari-bank-support.example/", "https://hikari-bnak.example/"], "ans": 1, "exp": "「https://」のうしろの住所（ホスト名）を右から読みます。「…hikari-bank.example」で終わるものが本物。ほかは、正体が「login-check.example」、別の名前、つづりちがい（bnak）です。", "lesson": "s2"}, {"q": "宅配業者を名乗るSMSのリンクを開き、会社のメールのIDとパスワードを入力してしまった。まずやるべきことは？", "opts": ["SMSに返信して、本物の宅配業者か確かめる", "もう一度リンクを開き、入力が正しかったか確かめる", "被害が出ていないか、1週間ほど様子を見る", "すぐにパスワードを変え、社内の窓口に報告する"], "ans": 3, "exp": "入力した情報は、もう盗まれていると考えます。本物のサイト（ブックマーク）でパスワードを変え、同じパスワードのほかのサービスも変えます。会社のアカウントなら、ログイン履歴の確認などは社内の窓口が行うので、すぐに報告を。", "lesson": "s2"}, {"q": "「ソーシャルエンジニアリング」とは？", "opts": ["人の心理のすきをついて、情報やお金をだまし取る手口", "ソフトの弱点（脆弱性）を突いて、PCに入りこむ攻撃", "SNSに公開された情報を集めて、会社を分析する調査", "社会のしくみをITで改善する、エンジニアの仕事"], "ans": 0, "exp": "技術ではなく“人”を狙う手口です。「至急」「内緒で」「社長の指示」などで、考える時間を奪います。", "lesson": "s3"}, {"q": "取引先から「振込先口座を変更しました」とメールが届いた。署名もいつもどおり。正しい対応は？", "opts": ["署名も文面もいつもどおりなので、そのまま変更する", "以前から知っている番号で確かめ、複数人で承認する", "メールに書かれた担当者の電話番号に電話して確かめる", "同じメールに返信して、本当に変わったのか聞く"], "ans": 1, "exp": "ビジネスメール詐欺（BEC）。メールに書かれた番号や返信先は、犯人につながっているかもしれません。必ず別の経路（以前から知っている番号）で確かめます。", "lesson": "s3"}, {"q": "PCに「ウイルスに感染しました！今すぐこの番号に電話してください」と、大きな音とともに表示された。正しい対応は？", "opts": ["表示された番号に電話して、指示どおりに対応する", "画面の指示に従い、ウイルス駆除ソフトを入れる", "画面の「今すぐ修復」ボタンを押して、修復を待つ", "電話はせず、ブラウザを閉じる（無理なら再起動）"], "ans": 3, "exp": "サポート詐欺（偽警告）です。本物のセキュリティソフトが、電話をかけさせることはありません。不安なら社内の窓口やIPAの安心相談窓口へ。", "lesson": "s3"}, {"q": "大量の迷惑メールが届いた直後に、Teamsで「IT部門です。止めるので、画面の操作を許可してください」と連絡が来た。正しい対応は？", "opts": ["表示名が「IT部門」になっているので、許可する", "相手の名前と部署を聞いてから、許可する", "許可せず、自分から社内の正式な窓口に確かめる", "画面の操作は許可せず、パスワードだけ伝える"], "ans": 2, "exp": "「メール爆弾＋偽ヘルプデスク」の手口です。Teamsの表示名は誰でも名乗れ、名前や部署もうそをつけます。社外の相手には「外部」と表示されることも確かめましょう。", "lesson": "s3"}, {"q": "「リスト型攻撃（パスワードリスト攻撃）」の説明として正しいものは？", "opts": ["よそで漏れたIDとパスワードを、別のサービスで試す", "あらゆる文字の組み合わせを、順番にすべて試していく", "よく使われる単語や名前のリストから、順番に試していく", "社員の名簿を手に入れて、本人になりすまして電話する"], "ans": 0, "exp": "パスワードの使い回しを狙う攻撃です。1つのサイトから漏れると、同じパスワードを使っているすべてのサービスが危険になります。ほかの選択肢は、総当たり攻撃・辞書攻撃・ソーシャルエンジニアリングです。", "lesson": "s4"}, {"q": "最新のガイドライン（米国NIST SP 800-63B-4など）に沿ったパスワードの考え方は？", "opts": ["毎月必ず変更し、前のパスワードとは少なくとも1文字変える", "短くても記号・数字・大文字を必ず混ぜれば、安全と考える", "忘れないように、どのサービスも同じ強いパスワードにそろえる", "長く推測されにくいものをサービスごとに別にし、漏れたら変える"], "ans": 3, "exp": "記号の混ぜ方などのルールより「長さ」を重視し、定期的な変更は求めず、漏れた証拠があれば変える、という考え方です。使い回しは、1か所の漏えいで全部が危険になります。", "lesson": "s4"}, {"q": "ランダムに作るパスワードの「組み合わせの数」の考え方として、正しいものは？", "opts": ["種類の数と文字数を、1回だけ掛ける（種類の数×文字数）", "種類の数を、文字数の回数だけ掛ける（種類の数の文字数乗）", "種類の数と文字数を、足し合わせる（種類の数＋文字数）", "文字数を、種類の数の回数だけ掛ける（文字数の種類の数乗）"], "ans": 1, "exp": "26種類の8文字なら、26を8回掛けて約2×10¹¹通り。1文字増えるたびに、組み合わせは種類の数（26〜94）倍になります。だから「長さ」がいちばん効くのです。", "lesson": "s4"}, {"q": "多要素認証（MFA）として正しい組み合わせは？", "opts": ["パスワード＋スマホでの承認や指紋による確認", "パスワード＋登録しておいた秘密の質問の答え", "パスワードを2回、別々の画面で続けて入力する", "長いパスワード1つだけを、毎回きちんと入力する"], "ans": 0, "exp": "「知っているもの」「持っているもの」「本人そのもの」のうち、種類のちがう2つ以上を組み合わせるのがMFA。パスワードと秘密の質問は、どちらも「知っているもの」です。", "lesson": "s5"}, {"q": "夜中に、身に覚えのない「サインインを承認しますか？」の通知が何度も届いた。正しい対応は？", "opts": ["鳴りやまないので、とりあえず1回だけ承認して止める", "通知をオフにして、朝になってから考える", "拒否して、パスワードを変え、IT担当に報告する", "自分のミスかもしれないので、承認してみる"], "ans": 2, "exp": "MFA疲労攻撃です。通知が来るということは、パスワードはすでに盗まれている可能性が高いです。", "lesson": "s5"}, {"q": "パスキーがフィッシングに強い理由は？", "opts": ["鍵が本物のサイトとしか使えず、偽サイトでは動かないから", "指紋や顔で本人確認するので、他人には使えないから", "パスワードより文字数が多く、総当たりで破れないから", "毎日自動で新しい鍵に変わるので、盗まれても平気だから"], "ans": 0, "exp": "パスキーは、登録したサイト（ドメイン）専用の鍵です。指紋や顔は“自分の端末に本人だと伝える”ためのもので、偽サイトに強い理由ではありません。", "lesson": "s5"}, {"q": "ランサムウェアの「二重恐喝」とは？", "opts": ["同じデータを2回暗号化して、戻しにくくすること", "身代金を払ったあとに、もう一度身代金を求めること", "会社と取引先の2か所を、同時に暗号化すること", "暗号化に加えて、盗んだデータを公開すると脅すこと"], "ans": 3, "exp": "バックアップで元に戻せても「情報を公開するぞ」と脅されます。だから、侵入を防ぐ・早く気づく守りも必要です。", "lesson": "s6"}, {"q": "ランサムウェアに備えるバックアップとして、最も適切なものは？", "opts": ["同じPCの別のフォルダに、毎日コピーしておく", "切り離したコピーも取り、戻せるか定期的に試す", "いつもつないでいる共有フォルダに保存しておく", "クラウドに同期しているので、ほかには何もしない"], "ans": 1, "exp": "つながったままのコピーは、一緒に暗号化されることがあります。同期だけのクラウドも、暗号化されたファイルが同期されることがあります。「切り離したコピー」と「復元テスト」がポイントです。", "lesson": "s6"}, {"q": "「パスワード付きZIP」が添付されたメールについて、正しいものは？", "opts": ["パスワードで守られているので、中身はいつも安全", "ZIPファイルなので、開くと必ずウイルスに感染する", "セキュリティソフトが中身を確かめにくく、悪用されやすい", "パスワードが別のメールで届けば、本物と判断できる"], "ans": 2, "exp": "パスワードを別のメールで送ってくる手口もあるので、それだけで本物とは言えません。心当たりのない添付は開かず、送り主に別の方法で確かめましょう。", "lesson": "s6"}, {"q": "「ゼロデイ攻撃」とは？", "opts": ["毎日0時ちょうどに、自動で始まる攻撃", "被害がゼロで終わった、失敗した攻撃", "攻撃者が0円で行う、無料のツールを使った攻撃", "修正プログラムがまだない弱点を突く攻撃"], "ans": 3, "exp": "開発元も対策できていない「0日目」の弱点を突く攻撃です。更新では防げないので、多層防御や検知で備えます。", "lesson": "s7"}, {"q": "実際の被害として多いのは、次のうちどれ？", "opts": ["メーカーも知らない、未知の弱点（ゼロデイ）を突かれる", "セキュリティソフトの入っていないPCだけが狙われる", "修正が公開済みなのに、更新していなかった弱点を突かれる", "大企業のサーバーだけが狙われ、小さな会社は狙われない"], "ans": 2, "exp": "ゼロデイ攻撃も起きますが、数として多いのは「直し方が出ているのに直していない」機器への攻撃です。公開された弱点は、攻撃者もすぐに調べます。", "lesson": "s7"}, {"q": "DDoS攻撃の説明として正しいものは？", "opts": ["乗っ取った大量の機器から、一斉にアクセスして止める攻撃", "1台のPCに入りこみ、パスワードをまとめて盗む攻撃", "データを暗号化し、元に戻す代わりに身代金を求める攻撃", "大量の偽メールを送り、偽サイトでIDを盗む攻撃"], "ans": 0, "exp": "Distributed Denial of Service（分散型サービス妨害）。「可用性」を損なう攻撃です。ほかの選択肢は、情報の盗み出し・ランサムウェア・フィッシングです。", "lesson": "s8"}, {"q": "一般の利用者にできるDDoS対策として、最も適切なものは？", "opts": ["攻撃してきた相手を調べて、同じ方法で仕返しする", "家のルーターやカメラの初期パスワードを変え、更新する", "PCにウイルス対策ソフトを入れ、ほかの機器は気にしない", "回線を速いプランに変えて、攻撃に負けないようにする"], "ans": 1, "exp": "DDoSの“兵隊”は、乗っ取られた家庭の機器です。家の回線を速くしても、サービス側への攻撃は止まりません。仕返しは犯罪になります（STEP16）。", "lesson": "s8"}, {"q": "DDoS攻撃が「おとり」に使われる、とはどういうこと？", "opts": ["わざと失敗する攻撃をして、守る側を油断させること", "身代金を払わせるためだけに、サイトを止めること", "騒ぎで注意を引き、そのすきに別の侵入や送金を行うこと", "攻撃者が自分の居場所を隠すために、大量に送ること"], "ans": 2, "exp": "大きな騒ぎは目くらましのことも。DDoSの最中ほど、ほかの異常（不審なログイン・送金の依頼）にも目を配ります。", "lesson": "s8"}, {"q": "「ロジックボム（論理爆弾）」の説明として正しいものは？", "opts": ["条件がそろうと動き出す、プログラムに隠された仕掛け", "大量のメールを送りつけて、受信箱を使えなくすること", "解凍すると巨大になる、とても小さな圧縮ファイル", "自分のコピーを際限なく増やし、PCを固まらせること"], "ans": 0, "exp": "社内の人が仕込むことが多い“内側”の脅威です。ほかの選択肢は、メール爆弾・ZIP爆弾・フォーク爆弾です。", "lesson": "s9"}, {"q": "「ZIP爆弾（解凍爆弾）」とは？", "opts": ["パスワード付きで、セキュリティソフトが中を見られないもの", "開いた瞬間に、PCの部品を物理的に壊してしまうもの", "条件がそろうと、中のファイルを自動で消してしまうもの", "解凍すると巨大になり、保存領域やメモリを埋め尽くすもの"], "ans": 3, "exp": "有名な例では、約42KBのファイルが、すべて解凍すると約4.5PB（ペタバイト）になります。", "lesson": "s9"}, {"q": "ロジックボムを防ぐ会社のしくみとして、有効なものは？", "opts": ["しくみに詳しい担当者1人に、変更をすべて任せる", "変更を別の人がレビュー・承認してから本番に入れる", "動作テストで問題がなければ、中身は確かめない", "退職者のアカウントは、念のため1年間残しておく"], "ans": 1, "exp": "1人で完結させないしくみ（変更管理・職務分掌）が、内側からの仕掛けを防ぎます。ふだんは何もしない仕掛けは、動作テストでは見つかりません。", "lesson": "s9"}, {"q": "「プロンプトインジェクション」とは？", "opts": ["AIの学習データに不正なデータを混ぜ、答えをゆがめる攻撃", "AIに大量の質問を送りつけて、サービスを止める攻撃", "AIを使って、本物そっくりの声や動画を作る攻撃", "AIが読む文書などに命令を隠し、意図しない操作をさせる攻撃"], "ans": 3, "exp": "AIは「データ」と「命令」の区別が苦手なことがあります。ほかの選択肢は、データの汚染・DoS攻撃・ディープフェイクで、どれも別の攻撃です。", "lesson": "s10"}, {"q": "社長の声そっくりの電話で「至急この口座に振り込んで」と言われた。正しい対応は？", "opts": ["社長の声と話し方なので、本人と判断して振り込む", "いったん切り、以前から知っている番号にかけ直して確かめる", "電話の相手が教えてくれた番号に、かけ直して確かめる", "急ぎの用件なので、金額を減らして先に振り込んでおく"], "ans": 1, "exp": "AIで声や顔をまねるディープフェイクです。相手が教える番号は犯人につながっているかもしれません。社内の名簿など、以前から知っている番号にかけ直すか、合言葉や社内の承認手続きで確かめます。", "lesson": "s10"}, {"q": "AIアシスタントにメールの整理を任せるときの、安全な設計は？", "opts": ["権限を最小限にし、送信や削除の前に人が確かめる", "効率のため、送信・削除・支払いまで自動で任せる", "メールに書かれた指示には、必ず従うように設定する", "便利なので、AIに管理者と同じ権限を与えておく"], "ans": 0, "exp": "最小権限と「人の確認」。プロンプトインジェクションでAIがだまされても、被害を止められます。", "lesson": "s10"}, {"q": "GitHubに、APIキー（サービスを使うための鍵）を含むファイルを公開してしまった。最初にすべきことは？", "opts": ["ファイルを削除して公開を取り消せば、それで問題ない", "リポジトリを非公開に切り替えて、様子を見る", "まず鍵を無効化して作り直し、そのあと履歴からも消す", "リポジトリの名前を変えて、見つかりにくくする"], "ans": 2, "exp": "公開した情報は、すぐに自動プログラムに見つけられ、コピーや履歴にも残ります。「消す」より先に「鍵を無効にする」。", "lesson": "s11"}, {"q": "社外の1人にファイルを共有するとき、最も安全なリンクの設定は？", "opts": ["リンクを知っているすべてのユーザー（誰でも開ける）", "特定のユーザー（相手を指定）にし、必要なら期限も付ける", "リンクを知っているすべてのユーザーにし、期限を1年にする", "ファイルを、相手の個人のフリーメールに添付して送る"], "ans": 1, "exp": "「リンクを知っているすべてのユーザー」は、転送されれば誰でも開けます。期限を付けても、期間中は誰でも開けます。相手を指定するのがいちばん安全です。", "lesson": "s11"}, {"q": "バックアップの「3-2-1ルール」として正しいものは？", "opts": ["3日ごと・2つのフォルダ・1年分を保存する", "3世代分・2台のPC・1つのUSBメモリに保存", "3人で管理・2重のパスワード・1日1回保存", "コピー3つ・保存先2種類・1つは離れた場所"], "ans": 3, "exp": "データのコピーを3つ（元のデータを含む）、2種類の保存先に分け、1つは離れた場所に。さらに1つを切り離すと、ランサムウェアに強くなります。", "lesson": "s12"}, {"q": "個人がまず取り組むと効果が大きい対策の組み合わせは？", "opts": ["MFA・使い回さない・自動更新・バックアップ", "あやしいサイトの名前を、できるだけ覚えておく", "セキュリティソフトを2つ入れて、二重に守る", "パスワードを毎月変えて、紙に書いてPCに貼る"], "ans": 0, "exp": "この4つで、個人を狙う攻撃の大部分を防げます。セキュリティソフトの重ねがけは、かえって動作が不安定になることもあります。", "lesson": "s12"}, {"q": "「ゼロトラスト」の考え方として正しいものは？", "opts": ["VPNで社内につないだ人は、すべて信用する", "一度ログインしたら、その日は確認しない", "社内・社外を問わず、アクセスのたびに確かめる", "社外からのアクセスだけを、念入りに確かめる"], "ans": 2, "exp": "「中に入れたら安全」をやめ、場所ではなく「誰が・どの端末で・何に」を毎回確かめる考え方です。", "lesson": "s13"}, {"q": "自分のPCだけで使うツールのサーバーを動かすとき、安全な待ち受け先は？", "opts": ["0.0.0.0（どこからの接続も受け付ける）", "PCに割り当てられた、社内ネットワークのアドレス", "どのアドレスで待ち受けても、安全性は同じ", "127.0.0.1（自分のPCの中だけ）"], "ans": 3, "exp": "127.0.0.1は「自分自身」を表す特別なアドレス。ほかのPCからは接続できません。", "lesson": "s14"}, {"q": "利用者が入力した文字を画面に表示するときの、安全な方法は？", "opts": ["入力を「文字」として扱い、特別な記号を無害化する", "入力をそのままHTMLとして、画面に組み込んで表示する", "入力をそのまま、データベースへの命令につなげる", "入力を一度実行してみて、問題がなければ表示する"], "ans": 0, "exp": "そのまま組み込むと、入力に仕込まれたプログラムが動いてしまいます（XSS・インジェクション）。", "lesson": "s14"}, {"q": "会社のPCでウイルス感染が疑われるとき、最初にすべきことは？", "opts": ["自分で初期化して、なかったことにして仕事を続ける", "同じPCで、すぐにすべてのパスワードを変更する", "ネットワークから切り離し、すぐに社内の窓口へ報告", "まずは電源を切って、翌日まで様子を見る"], "ans": 2, "exp": "広げない・早く報告する、が最優先です。電源を切ると調査の手がかりが消えることがあり、同じPCでのパスワード変更は、新しいパスワードも盗まれるおそれがあります。", "lesson": "s15"}, {"q": "他人のIDとパスワードを使い、許可なくログインした。すぐにログアウトし、何もしなかった場合は？", "opts": ["何も見たり変えたりしていないので、罪にはならない", "ログインしただけで、不正アクセス禁止法違反になる", "元同僚の、昔から知っているアカウントなら問題ない", "相手に気づかれなければ、法律上は問題にならない"], "ans": 1, "exp": "勝手にログインした時点で犯罪です（3年以下の拘禁刑または100万円以下の罰金）。「試しに」「確かめるだけ」でも同じです。", "lesson": "s16"}], "MQ": {"what": {"q": "通販サイトに大量のアクセスを送りつけて「つながらない」状態にする攻撃が、主に損なうのは？", "opts": ["機密性", "完全性", "可用性", "どれも損なわない"], "ans": 2, "exp": "必要なときに使えない＝可用性。DDoS攻撃（STEP8）がこれにあたります。", "lesson": "what"}, "case": {"q": "情報資産の洗い出しで、最初に考えるべきことは？", "opts": ["何を守り、それが漏れたり止まったりすると何が困るか", "どのメーカーのセキュリティ製品が、いちばん高性能か", "攻撃してきそうな犯罪グループの名前と、その手口", "社員一人ひとりが、どれだけPCに詳しいか"], "ans": 0, "exp": "守るもの（情報資産）と、その大事さ（CIA）を知ることから。対策の優先順位は、そこから決まります。", "lesson": "case"}, "s1": {"q": "冒頭の事例（古いVPN機器から入られ、3週間かけて社内を探られた）で、「中に入られたあとで気づく」守りにあたるのは？", "opts": ["VPN機器を、すぐに最新に更新しておく", "切り離したバックアップから、元に戻す", "SNSに載せる会社の情報を、少なくする", "EDRで、PCの不審なふるまいに気づく"], "ans": 3, "exp": "更新は「入口」、バックアップは「もしものとき」、公開情報を絞るのは「下見」への守りです。入口・中・もしものときと、種類のちがう守りを重ねるのが多層防御です。", "lesson": "s1"}, "s2": {"q": "フィッシングに対して、いちばん確実な習慣は？", "opts": ["メールの日本語が自然かどうかで、本物かを判断する", "リンクから入らず、公式アプリかブックマークから開く", "鍵マーク（https）があれば、安心して入力する", "差出人の名前が知っている会社なら、本物と考える"], "ans": 1, "exp": "日本語の自然さ・鍵マーク・差出人の名前は、どれも偽物でもそろえられます。「リンクから入らない」習慣がいちばん確実です。", "lesson": "s2"}, "s3": {"q": "振込先の変更を悪用する詐欺に対して、いちばん強い守りは？", "opts": ["経理の担当者に、怪しいメールの見分け方を覚えてもらう", "取引先に、メールの署名を毎回入れてもらうよう頼む", "メールだけでは変更を受け付けない、と社内ルールで決める", "振込のたびに、担当者がメールを慎重に読み直す"], "ans": 2, "exp": "人の注意力には限界があります。メール以外の経路での確認と、複数人での承認を「ルール」にするのが、いちばん強い守りです。", "lesson": "s3"}, "s4": {"q": "いちばん強いパスワードはどれ？（すべてランダムに作った場合）", "opts": ["記号を含む8文字", "英小文字だけの16文字", "数字だけの10文字", "英大文字と小文字の10文字"], "ans": 1, "exp": "組み合わせは「種類の数」の「文字数」乗。94種類の8文字（約6×10¹⁵）より、26種類の16文字（約4×10²²）のほうが、けたちがいに多くなります。", "lesson": "s4"}, "s5": {"q": "身に覚えのない承認の通知が何度も届く。このとき、パスワードはどういう状態と考えるべき？", "opts": ["すでに盗まれている可能性が高い", "通知が来ただけなので、まだ安全", "スマホが故障しているだけで、問題ない", "MFAの設定が、勝手に消えてしまった"], "ans": 0, "exp": "承認の通知は、誰かがパスワードの入力までは成功したときに届きます。拒否して、パスワードを変え、報告しましょう。", "lesson": "s5"}, "s6": {"q": "ランサムウェアの被害を減らすため、バックアップに必ず加えたいのは？", "opts": ["同じPCの中に、もう1つ作っておくコピー", "いつもつないでいる共有フォルダへのコピー", "毎日上書きして、最新の1つだけ残すコピー", "ふだんはネットワークから切り離しておくコピー"], "ans": 3, "exp": "つながっているコピーは一緒に暗号化されがちです。上書きだけのコピーは、暗号化されたファイルで上書きされてしまうこともあります。", "lesson": "s6"}, "s7": {"q": "修正プログラムが公開された弱点について、正しいものは？", "opts": ["公開されたら直ったので、もう誰にも狙われることはない", "ゼロデイ攻撃と同じ意味で、更新しても防げない", "弱点の場所も知られ、更新しない機器が狙われやすい", "サポートが終わった製品にも、自動で配られる"], "ans": 2, "exp": "修正の公開は、攻撃者にとって“弱点の地図”にもなります。だから、すぐに当てることが大切です。", "lesson": "s7"}, "s8": {"q": "DDoS攻撃の“兵隊”になっているのは、主にどんな機器？", "opts": ["乗っ取られた家庭や会社のPC・ルーター・カメラ", "攻撃者が自分で買いそろえた、大量の新品サーバー", "国やプロバイダーが管理している、通信の中継機器", "古くなって捨てられ、電源が入っていない機器"], "ans": 0, "exp": "持ち主が気づかないうちに乗っ取られた機器（ボット）が使われます。初期パスワードの変更と更新で、自分の機器を守りましょう。", "lesson": "s8"}, "s9": {"q": "ロジックボムが、ファイアウォールでは防ぎにくい理由は？", "opts": ["外から大量のアクセスで、守りをあふれさせるから", "内側の人が、正規の権限でプログラムに仕込むから", "インターネットを通らず、USBメモリだけで広がるから", "暗号化されていて、中身がまったく読めないから"], "ans": 1, "exp": "外からの通信を止める守りは、内側の正規の作業には効きません。変更管理・職務分掌などの“しくみ”で防ぎます。", "lesson": "s9"}, "s10": {"q": "会社のルールが特にないとき、生成AIに入れると危ない情報は？", "opts": ["会社のWebサイトで、すでに公開しているお知らせ", "ていねいなメールの言い回しについての、一般的な質問", "自分で書いた、機密を含まない文章の誤字チェック", "お客さまの名簿や、パスワード・APIキー"], "ans": 3, "exp": "個人情報や秘密情報は、AIに入れると外に出てしまうおそれがあります。会社が許可したAIとルールの範囲で使いましょう。", "lesson": "s10"}, "s11": {"q": "公開リポジトリに鍵を置き忘れると、なぜ危ない？", "opts": ["GitHubの運営会社が、鍵を自動で使ってしまうから", "公開した本人のPCに、ウイルスが入りやすくなるから", "自動プログラムが常に探していて、すぐ悪用されるから", "鍵の文字列が長すぎて、プログラムが動かなくなるから"], "ans": 2, "exp": "公開された鍵は、数分〜数時間で見つかって悪用されることがあります。だから、漏れたら「まず無効化」です。", "lesson": "s11"}, "s12": {"q": "バックアップの「3-2-1ルール」の「1」は何？", "opts": ["1つは離れた場所に置く", "1日1回はバックアップする", "1人の担当者が責任を持つ", "1年分はさかのぼれるようにする"], "ans": 0, "exp": "3つのコピー・2種類の保存先・1つは離れた場所。火事や盗難にも備えます。さらに1つを切り離すと、ランサムウェアに強くなります。", "lesson": "s12"}, "s13": {"q": "取引先から対策の状況を聞かれた。信頼につながる答え方は？", "opts": ["「大手の製品を入れているので安心です」と答える", "「これまで一度も事故はありません」と答える", "「担当者がしっかり見ています」と答える", "台帳・ルール・実施の記録を示して説明する"], "ans": 3, "exp": "製品名や「事故がない」だけでは、守りが回っている証拠になりません。内部統制と同じで、“やったことを残す”ことが信頼になります。", "lesson": "s13"}, "s14": {"q": "自作のWebツールでエラーが起きた。利用者に見せる画面として、適切なものは？", "opts": ["原因がわかるよう、プログラムの詳しいエラーをそのまま出す", "「エラーが起きました」とだけ伝え、詳しい内容はログに残す", "データベースの設定やファイルの場所も、いっしょに表示する", "エラーは画面にもログにも出さず、何もなかったことにする"], "ans": 1, "exp": "詳しいエラーには、ファイルの場所や設定など、攻撃のヒントになる情報が含まれます。利用者には短く伝え、詳しい内容はログに残して原因を調べます（原則8）。", "lesson": "s14"}, "s15": {"q": "被害にあったとき、いちばん被害を大きくしてしまう行動は？", "opts": ["ネットワークから切り離すこと", "時刻と見たことをメモしておくこと", "隠したり、報告を遅らせたりすること", "社内の窓口にすぐ連絡すること"], "ans": 2, "exp": "隠す・遅れるほど、被害は広がり、手がかりも消えます。ほかの3つは、どれも正しい初動です。", "lesson": "s15"}, "s16": {"q": "セキュリティを合法的に学ぶ方法として、正しいものは？", "opts": ["自分のPCに練習用の環境を作って、そこで試す", "知り合いの会社のサイトで、こっそり弱点を探す", "公開されているサイトに、試しに大量のアクセスを送る", "ネットで見つけたウイルスを、友だちのPCで動かす"], "ans": 0, "exp": "自分の環境なら、攻撃のしくみを安全に学べます。ほかの3つは、どれも犯罪になるおそれがあります（不正アクセス・業務妨害・ウイルス供用）。", "lesson": "s16"}}, "GLOSS": [["サイバー攻撃", "さいばーこうげき", "Cyberattack", "コンピューターやネットワークを使って、情報を盗んだり、システムを壊したり止めたりすること", "ニュースでいう「ハッキング」の多くはこれ"], ["ハッカー", "はっかー", "Hacker", "もともとは、コンピューターに詳しい人のこと", "悪用する人は「攻撃者」「クラッカー」と呼び分ける"], ["ホワイトハッカー", "ほわいとはっかー", "White-hat hacker", "技術を、守るために使う専門家", "許可を得て弱点を調べる（ペネトレーションテストなど）"], ["機密性", "きみつせい", "Confidentiality", "見てよい人だけが情報を見られること", "情報漏えいで損なわれる"], ["完全性", "かんぜんせい", "Integrity", "情報が正しく、勝手に書き換えられていないこと", "改ざんで損なわれる"], ["可用性", "かようせい", "Availability", "必要なときに使えること", "DDoSやランサムウェアで損なわれる"], ["情報資産", "じょうほうしさん", "Information asset", "守るべき情報や機器（顧客リスト・PC・Webサイトなど）", "対策は、守るものの洗い出しから"], ["脅威", "きょうい", "Threat", "被害を起こすおそれのあるもの（攻撃者・ウイルス・災害・うっかりミスなど）", "IPAが毎年「10大脅威」を公表"], ["多層防御", "たそうぼうぎょ", "Defense in depth", "種類のちがう守りを何重にも重ねる考え方", "スイスチーズモデルとも"], ["脆弱性", "ぜいじゃくせい", "Vulnerability", "ソフトや設定の弱点（攻撃に使える欠陥）", "更新（パッチ）でふさぐ"], ["パッチ", "ぱっち", "Patch", "弱点や不具合を直す修正プログラム", "「アップデート」とほぼ同じ意味で使う"], ["ゼロデイ攻撃", "ぜろでいこうげき", "Zero-day attack", "修正プログラムがまだない弱点を突く攻撃", "多層防御と検知で備える"], ["サポート終了", "さぽーとしゅうりょう", "End of support / EOL", "メーカーが修正プログラムを出さなくなること", "使い続けると、弱点が直らないまま残る"], ["フィッシング", "ふぃっしんぐ", "Phishing", "実在の会社などになりすました偽メール・偽サイトで、IDやパスワード、カード番号などをだまし取る手口", "リンクからログインしない"], ["スミッシング", "すみっしんぐ", "Smishing", "SMS（ショートメッセージ）を使ったフィッシング", "宅配の不在通知を装う例が多い"], ["クイッシング", "くいっしんぐ", "Quishing", "QRコードで偽サイトへ誘導するフィッシング", "チラシや張り紙のQRにも注意"], ["ドメイン", "どめいん", "Domain", "インターネット上の住所の名前（例：hikari-bank.example）", "URLの住所の部分（「/」「?」「#」の手前まで）を右から読む"], ["HTTPS", "えいちてぃーてぃーぴーえす", "HTTPS", "通信を暗号化するしくみ（アドレス欄の鍵マーク）", "本物のサイトの証明ではない"], ["ホモグリフ", "ほもぐりふ", "Homoglyph", "見た目がそっくりな別の文字（数字の1と英字のl、rnとm、ほかの言語の文字など）", "そっくりなドメインの偽サイトに使われる。目で見分けるのには限界がある"], ["ソーシャルエンジニアリング", "そーしゃるえんじにありんぐ", "Social engineering", "人の心理（信頼・あせり・恐れ・親切心）をついて、情報やお金をだまし取る手口", "「至急」「内緒で」は危険信号"], ["ビジネスメール詐欺", "びじねすめーるさぎ", "Business Email Compromise (BEC)", "取引先や経営者になりすまし、偽の口座に振り込ませる詐欺", "振込先の変更は、別の経路で確かめる"], ["SPF・DKIM・DMARC", "えすぴーえふ・でぃーきむ・でぃーまーく", "Email authentication", "メールの差出人のドメインが偽装されていないかを、受け取る側が確かめられるようにするしくみ", "会社のドメインに設定して、なりすましメールを防ぐ"], ["サポート詐欺", "さぽーとさぎ", "Tech support scam", "偽の警告画面で不安にさせ、電話をかけさせて、お金や遠隔操作をだまし取る手口", "表示された番号に電話しない"], ["メール爆弾", "めーるばくだん", "Email bombing", "大量のメールを送りつけて、受信箱     ${analogy("守りは、穴のあいたスライスチーズを何枚も重ねるイメージです。1枚ごとに穴（弱点）はあっても、重ねれば穴が一直線にそろうことはめったにありません。これを<b>多層防御</b>（スイスチーズモデル）といいます。", "スイスチーズにたとえると")}
    <div class="card"><h2>やってみよう：守りを重ねると、どこで止まる？</h2>
      <p class="small muted">① 攻撃の種類を選び、② 守りのスイッチをON/OFFしてください。攻撃がどの段階で止まるかが変わります。</p>
      <div class="seg wrap" id="scSeg">${D.SCENARIOS.map((s, i) => `<button type="button" data-i="${i}"${i ? "" : ' class="on"'}>${s.name}</button>`).join("")}</div>
      <div class="switches s3" style="margin-top:12px">${D.DEFENSES.map((d) => `<label class="sw" data-d="${d.id}"><input type="checkbox" value="${d.id}"><span><b>${d.name}</b>${d.desc}</span></label>`).join("")}</div>
      <div class="btnrow"><button class="btn ghost" type="button" id="dAll">全部ON</button><button class="btn ghost" type="button" id="dNone">全部OFF</button></div>
      <div class="lane" id="lane"></div><div class="result" id="dRes" aria-live="polite"></div>
      <p class="note">※学習用に単純化しています。現実には、どの守りも100%ではありません。だからこそ重ねます。</p></div>
    ${mqd("s1")}
    ${ciso("「攻撃者は1か所破れば勝ち、守る側は全部守らなければ負け」とよく言われます。でも見方を変えれば、<b>守る側は4つの段階のどこか1か所で止めればよい</b>のです。入口だけでなく「中で気づく」「広げない」「元に戻せる」守りを重ねましょう。")}`,
    mount(root) {
      let sc = 0;
      const on = () => new Set($$(".switches input", root).filter((x) => x.checked).map((x) => x.value));
      const dn = (id) => (D.DEFENSES.find((d) => d.id === id) || {}).name;
      const draw = () => {
        const S = D.SCENARIOS[sc], act = on();
        $$(".switches .sw", root).forEach((l) => l.classList.toggle("on", act.has(l.dataset.d)));
        let stopped = -1, how = "";
        const cells = S.stages.map((g, i) => {
          const hd = `<div class="sn">${i + 1}. ${g.n}</div><div>${g.t}</div>`;
          if (stopped >= 0) return `<div class="stg skip">${hd}<div class="st">（ここまで来ない）</div></div>`;
          const hit = Object.keys(g.stop).find((k) => act.has(k));
          if (hit) { stopped = i; how = g.stop[hit]; return `<div class="stg ok">${hd}<div class="st">✔ ここで止めた（${dn(hit)}）</div></div>`; }
          const cand = Object.keys(g.stop).map(dn);
          return `<div class="stg bad">${hd}<div class="st">✖ 突破された</div><div class="small muted">${cand.length ? "止められる守り：" + cand.join("・") : "この段階は防ぎにくい（ほかの段階で止める）"}</div></div>`;
        });
        $("#lane", root).innerHTML = cells.join("");
        const r = $("#dRes", root);
        if (stopped >= 0 && stopped <= 1) { r.className = "result good"; r.innerHTML = `<b class="check-ok">被害なし</b>　${how}。入口で止められました。`; }
        else if (stopped >= 2) { r.className = "result good"; r.innerHTML = `<b class="check-ok">被害を防いだ</b>　入られはしましたが、${how}。どこから入られたかを調べて、入口もふさぎましょう。`; }
        else if (S.encrypt && act.has("backup")) { r.className = "result mid"; r.innerHTML = "<b>ファイルは元に戻せた（でも被害はある）</b>　切り離したバックアップから復旧できました。ただし、盗まれた情報は戻らず、「公開するぞ」と脅されるおそれは残ります（二重恐喝）。"; }
        else { r.className = "result bad"; r.innerHTML = `<b class="check-ng">大きな被害</b>　${S.damage}。${S.encrypt ? "" : "（バックアップでは防げない種類の被害です）"}`; }
      };
      $$("#scSeg button", root).forEach((b) => b.addEventListener("click", () => { sc = +b.dataset.i; $$("#scSeg button", root).forEach((x) => x.classList.toggle("on", x === b)); draw(); }));
      $$(".switches input", root).forEach((x) => x.addEventListener("change", draw));
      $("#dAll", root).addEventListener("click", () => { $$(".switches input", root).forEach((x) => { x.checked = true; }); draw(); });
      $("#dNone", root).addEventListener("click", () => { $$(".switches input", root).forEach((x) => { x.checked = false; }); draw(); });
      draw();
    } };
}

const SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
function bigNum(x) {
  if (x < 1e8) return f0(x);
  const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
  return `約${m.toFixed(1)}×10${String(e).split("").map((c) => SUP[c]).join("")}`;
}
function dur(sec) {
  if (sec < 1) return "一瞬（1秒未満）";
  if (sec < 60) return `約${Math.round(sec)}秒`;
  if (sec < 3600) return `約${Math.round(sec / 60)}分`;
  if (sec < 86400) return `約${Math.round(sec / 3600)}時間`;
  const d = sec / 86400;
  if (d < 365) return `約${Math.round(d)}日`;
  const y = d / 365;
  if (y < 1e4) return `約${f0(y)}年`;
  if (y < 1e8) return `約${f0(y / 1e4)}万年`;
  if (y < 1e12) return `約${f0(y / 1e8)}億年`;
  if (y < 1e16) return `約${f0(y / 1e12)}兆年`;
  return "1京年以上（宇宙の年齢 約138億年より、はるかに長い）";
}

    <div class="card"><h2>セキュリティ運用カレンダー</h2><div class="tl">${D.CALENDAR.map(([d, w, p]) => `<div class="it"><div class="d">${d}</div><b>${w}</b><div class="small muted">CISOのチェック：${p}</div></div>`).join("")}</div></div>
    <div class="card"><h2>小さな会社の「最初の90日」</h2><div class="grid3">${D.PLAN90.map(([t, items]) => `<div class="tile"><div class="t">${t}</div><ul class="small">${items.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div>
    <div class="card"><h2>よくあるミスと対策</h2>${table(["よくあるミス", "何が起きる？", "対策"], D.MISTAKES.map((m) => [`<b>${m[0]}</b>`, `<span class="small">${m[1]}</span>`, `<span class="small">${m[2]}</span>`]))}</div>
    <div class="card"><h2>経営者に説明するときのコツ</h2><ul>
      <li>技術の言葉ではなく、<b>お金と業務</b>の言葉で（「止まったら1日いくら損するか」「取引先に何を報告するか」）</li>
      <li>「起こりやすさ × 影響の大きさ」で優先順位をつける</li>
      <li>完璧ではなく、<b>今より良くなる次の一手</b>と、その費用を示す</li>
      <li>事故は「起きるかどうか」ではなく「起きたとき、どれだけ早く戻せるか」</li></ul></div>
    <div class="card"><h2>役に立つ公的な資料</h2>${table(["資料・窓口", "内容"], D.RESOURCES.map((r) => [`<b>${r[0]}</b>`, r[1]]))}</div>
    ${ciso("セキュリティに“ゴール”はありません。でも、やることは毎年ほとんど同じです。<b>台帳・MFA・更新・バックアップ・訓練・報告の文化</b>。この6つを、毎月・毎年のカレンダーに落とせば、守りは自然と回り始めます。")}` };
}

function Gloss() {
  return { html: `${head("辞書", "用語集（英語つき）", "セキュリティの記事やニュースは英語の言葉が多いので、英語もいっしょに覚えておくと便利です。")}
    <input class="search" id="gq" type="search" placeholder="用語・英語・意味で検索（例：MFA、ランサム、DDoS）" aria-label="用語を検索">
    <div class="tbl-wrap" style="margin-top:12px"><table class="fs" id="gt"></table></div>`,
    mount(root) {
      const draw = () => {
        const q = $("#gq", root).value.trim().toLowerCase();
        const rows = D.GLOSS.filter((g) => !q || g.join(" ").toLowerCase().includes(q));
        $("#gt", root).innerHTML = `<tr><th>用語</th><th>英語</th><th>意味（やさしく）</th><th>ポイント</th></tr>` + (rows.length ? rows.map((g) =>
          `<tr><td><b>${g[0]}</b><div class="small muted">${g[1]}</div></td><td class="small">${g[2]}</td><td>${g[3]}</td><td class="small muted">${g[4]}</td></tr>`).join("") : '<tr><td colspan="4" class="muted">見つかりませんでした</td></tr>');
      };
      $("#gq", root).addEventListener("input", draw);
      draw();
    } };
}

/* ---------------------------------------------------------------- shell */
const RENDER = { welcome: Welcome, what: What, case: Case, s1: S1, s2: S2, s3: S3, s4: S4, s5: S5, s6: S6, s7: S7, s8: S8, s9: S9,
  s10: S10, s11: S11, s12: S12, s13: S13, s14: S14, s15: S15, s16: S16, quiz: Quiz, notes: Notes, gloss: Gloss };
const LESSONS = D.LESSONS.map((l) => ({ ...l, r: RENDER[l.id] }));
const XL_SHEETS = Object.fromEntries(D.LESSONS.filter((l) => l.xl).map((l) => [l.id, l.xl]));

function renderNav() {
  let g = "", h = "";
  LESSONS.forEach((l) => {
    if (l.grp !== g) { g = l.grp; h += `<div class="grp">${g}</div>`; }
    h += `<button type="button" class="${l.id === current ? "active" : ""}"${l.id === current ? ' aria-current="page"' : ""} data-go="${l.id}"><span class="tag">${l.tag}</span><span>${l.title}</span>${done[l.id] ? '<span class="ck">✓</span>' : ""}</button>`;
  });
  nav.innerHTML = h;
  const n = LESSONS.filter((l) => done[l.id]).length;
  $("#progbar").style.width = (n / LESSONS.length) * 100 + "%";
  $("#progtxt").textContent = `${n} / ${LESSONS.length} 完了`;
}
function go(id) {
  const L = LESSONS.find((x) => x.id === id) || LESSONS[0];
  current = L.id;
  store.set("current", current);
  if (window.LearnShell) LearnShell.sync(L.id, L.title);
  renderNav();
  const out = L.r();
  const i = LESSONS.indexOf(L), prev = LESSONS[i - 1], next = LESSONS[i + 1];
  main.innerHTML = out.html + `<div class="next-row">
    <button class="btn ghost" type="button" ${prev ? `data-go="${prev.id}"` : "disabled"}>◀ ${prev ? prev.title : "前へ"}</button>
    <button class="btn ghost" type="button" data-toggle-done="${L.id}">${done[L.id] ? "✓ 完了済み（取り消す）" : "このレッスンを完了にする"}</button>
    ${next ? `<button class="btn" type="button" data-go="${next.id}" data-complete="${L.id}">完了して次へ：${next.title} ▶</button>` : `<button class="btn" type="button" data-complete="${L.id}" data-go="welcome">完了してトップへ</button>`}</div>`;
  if (window.LearnShell && LearnShell.xlRef && XL_SHEETS[L.id]) LearnShell.xlRef(main, XL_SHEETS[L.id]);
  if (out.mount) out.mount(main);
  window.scrollTo(0, 0);
}
document.addEventListener("click", (e) => {
  const opt = e.target.closest(".quiz .opt");
  if (opt) {
    const box = opt.closest(".quiz"), ans = +box.dataset.ans, i = +opt.dataset.i;
    $$(".opt", box).forEach((b) => b.classList.remove("right", "wrong"));
    opt.classList.add(i === ans ? "right" : "wrong");
    if (i !== ans) $$(".opt", box)[ans].classList.add("right");
    $(".fb", box).classList.add("show");
    return;
  }
  const td = e.target.closest("[data-toggle-done]");
  if (td) { const id = td.dataset.toggleDone; done[id] = !done[id]; store.set("done", done); renderNav(); td.textContent = done[id] ? "✓ 完了済み（取り消す）" : "このレッスンを完了にする"; return; }
  const g = e.target.closest("[data-go]");
  if (g && g.dataset.go) {
    e.preventDefault();
    if (g.dataset.complete) { done[g.dataset.complete] = true; store.set("done", done); }
    go(g.dataset.go);
  }
});
$("#themeBtn").addEventListener("click", () => {
  const el = document.documentElement;
  el.setAttribute("data-theme", el.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
// toggle buttons (.seg) expose their on/off state to screen readers
const syncPressed = () => $$(".seg button", main).forEach((b) => { const v = b.classList.contains("on") ? "true" : "false"; if (b.getAttribute("aria-pressed") !== v) b.setAttribute("aria-pressed", v); });
try { new MutationObserver(syncPressed).observe(main, { subtree: true, childList: true, attributes: true, attributeFilter: ["class"] }); } catch (e) { /* MutationObserver unavailable */ }
go(window.LearnShell ? LearnShell.start(LESSONS, current) : current);

</script>
</body>
</html>
